<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #FF6B6B, #4ECDC4);">
  <rect width="100%" height="100%" fill="url(#healthGrad)"/>
  <defs>
    <linearGradient id="healthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Medical/Health Icon -->
  <g transform="translate(200,150)">
    <!-- Cross symbol -->
    <rect x="-30" y="-10" width="60" height="20" fill="white" opacity="0.9"/>
    <rect x="-10" y="-30" width="20" height="60" fill="white" opacity="0.9"/>
    
    <!-- Health data visualization -->
    <circle cx="-60" cy="-40" r="8" fill="white" opacity="0.7"/>
    <circle cx="-40" cy="-60" r="6" fill="white" opacity="0.7"/>
    <circle cx="-20" cy="-50" r="7" fill="white" opacity="0.7"/>
    <circle cx="0" cy="-70" r="5" fill="white" opacity="0.7"/>
    <circle cx="20" cy="-55" r="6" fill="white" opacity="0.7"/>
    <circle cx="40" cy="-65" r="8" fill="white" opacity="0.7"/>
    <circle cx="60" cy="-45" r="7" fill="white" opacity="0.7"/>
    
    <!-- Connection lines -->
    <path d="M-60,-40 L-40,-60 L-20,-50 L0,-70 L20,-55 L40,-65 L60,-45" 
          stroke="white" stroke-width="2" fill="none" opacity="0.6"/>
  </g>
  
  <!-- Category label -->
  <text x="200" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Health & Education
  </text>
</svg>
