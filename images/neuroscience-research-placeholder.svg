<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #a8edea, #fed6e3);">
  <rect width="100%" height="100%" fill="url(#neuroGrad)"/>
  <defs>
    <linearGradient id="neuroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a8edea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fed6e3;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Brain and neuron network -->
  <g transform="translate(200,150)">
    <!-- Brain outline -->
    <path d="M-60,-40 Q-80,-60 -40,-70 Q0,-80 40,-70 Q80,-60 60,-40 Q70,-20 50,0 Q60,20 40,40 Q0,50 -40,40 Q-60,20 -50,0 Q-70,-20 -60,-40" 
          fill="white" opacity="0.9"/>
    
    <!-- Neural network nodes -->
    <circle cx="-40" cy="-30" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="-20" cy="-45" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="0" cy="-35" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="20" cy="-25" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="40" cy="-15" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="-30" cy="0" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="0" cy="5" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="30" cy="15" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="-20" cy="25" r="4" fill="#fed6e3" opacity="0.8"/>
    <circle cx="10" cy="30" r="4" fill="#fed6e3" opacity="0.8"/>
    
    <!-- Neural connections -->
    <path d="M-40,-30 L-20,-45 L0,-35 L20,-25 L40,-15" stroke="#fed6e3" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-30,0 L0,5 L30,15" stroke="#fed6e3" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-20,25 L10,30" stroke="#fed6e3" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M-20,-45 L-30,0" stroke="#fed6e3" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M0,-35 L0,5" stroke="#fed6e3" stroke-width="1" fill="none" opacity="0.4"/>
    <path d="M20,-25 L30,15" stroke="#fed6e3" stroke-width="1" fill="none" opacity="0.4"/>
  </g>
  
  <!-- Category label -->
  <text x="200" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Neuroscience Research
  </text>
</svg>
