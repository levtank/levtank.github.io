<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" style="background: linear-gradient(135deg, #f093fb, #f5576c);">
  <rect width="100%" height="100%" fill="url(#scicommGrad)"/>
  <defs>
    <linearGradient id="scicommGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Science communication icons -->
  <g transform="translate(200,150)">
    <!-- Megaphone/speaker -->
    <polygon points="-60,-20 -30,-10 -30,10 -60,20 -80,15 -80,-15" fill="white" opacity="0.9"/>
    <circle cx="-90" cy="0" r="15" fill="white" opacity="0.9"/>
    
    <!-- Sound waves -->
    <path d="M-20,-15 Q10,-15 10,0 Q10,15 -20,15" stroke="white" stroke-width="3" fill="none" opacity="0.7"/>
    <path d="M-15,-25 Q20,-25 20,0 Q20,25 -15,25" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
    <path d="M-10,-35 Q30,-35 30,0 Q30,35 -10,35" stroke="white" stroke-width="1" fill="none" opacity="0.3"/>
    
    <!-- Film/camera icon -->
    <rect x="40" y="-25" width="50" height="35" fill="white" opacity="0.9" rx="5"/>
    <circle cx="60" cy="-7" r="8" fill="#f5576c" opacity="0.8"/>
    <rect x="35" y="-15" width="10" height="15" fill="white" opacity="0.9"/>
    
    <!-- Article/document -->
    <rect x="-50" y="30" width="30" height="40" fill="white" opacity="0.9" rx="2"/>
    <line x1="-45" y1="37" x2="-25" y2="37" stroke="#f5576c" stroke-width="1"/>
    <line x1="-45" y1="42" x2="-25" y2="42" stroke="#f5576c" stroke-width="1"/>
    <line x1="-45" y1="47" x2="-25" y2="47" stroke="#f5576c" stroke-width="1"/>
  </g>
  
  <!-- Category label -->
  <text x="200" y="260" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">
    Science Communication
  </text>
</svg>
